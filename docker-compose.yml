services:
  web:
    build: .
    container_name: flaskcrud_app
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: changeme
      MYSQL_DB: flaskcrud
      MYSQL_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: flaskcrud_db
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: flaskcrud
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchangeme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:

